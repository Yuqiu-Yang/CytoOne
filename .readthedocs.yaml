# Read the Docs configuration file for CytoOne
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

# Build the HTML docs with Sphinx
sphinx:
  configuration: docs/source/conf.py
  # Set to true once the docs are warning-clean to catch regressions
  fail_on_warning: false

# Also offer downloadable PDF / ePub builds
formats:
  - pdf
  - epub

# Install only the lightweight tooling needed to build the docs. The heavy
# runtime dependencies (torch, pyro, scanpy, ...) are mocked in conf.py via
# ``autodoc_mock_imports`` so the API reference renders without installing them.
python:
  install:
    - requirements: docs/requirements.txt
